<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Choose a new password — Did I Lock?</title>
<style>body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#fbfbfd;color:#24292f;display:grid;place-items:center;min-height:90vh;margin:0}.card{background:#fff;border:1px solid #e6e8ef;border-radius:16px;padding:34px 38px;max-width:420px;text-align:center}h1{font-size:1.2rem}a{color:#5b6bff}.field{margin:10px 0;text-align:left}.field span{display:block;font-size:13px;margin-bottom:4px;color:#57606a}.field input{width:100%;border:1px solid #d0d7de;border-radius:9px;padding:10px 12px;font-size:15px;box-sizing:border-box}#msg{margin:12px 0 0;font-size:.95rem}.btn{background:#5b6bff;color:#fff;border:none;border-radius:9px;padding:11px 18px;font-size:15px;cursor:pointer;width:100%}.btn[disabled]{opacity:.6}</style>
</head><body><div class="card"><h1>🔐 Choose a new password</h1><p id="msg">This link lets you set a new password.</p>
<div id="form">
  <div class="field"><span>New password (min 8 characters)</span><input type="password" id="pw" autocomplete="new-password" /></div>
  <div class="field"><span>Repeat it</span><input type="password" id="pw2" autocomplete="new-password" /></div>
  <button class="btn" id="go">Set new password</button>
</div>
<p><a href="/">Back to Did I Lock?</a></p></div>
<script src="/reset.js"></script></body></html>
