<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signing you in… · Did I Lock?</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex;
    align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f4f5fa; color: #101828; }
  .card { background: #fff; border: 1px solid #e6e9f0; border-radius: 16px; padding: 30px 34px; text-align: center;
    box-shadow: 0 10px 30px -12px rgba(16,24,40,.18); max-width: 340px; }
  .spin { width: 34px; height: 34px; margin: 0 auto 14px; border: 3px solid #e6e9f0; border-top-color: #4f46e5;
    border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .err { color: #e11d48; font-size: 14px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="spin" id="spin"></div>
    <div id="msg">Google sign-in complete — taking you home…</div>
  </div>
<script src="/handoff.js"></script>
</body>
</html>
